id: developer

name: Developer

description: >
  Helps developers understand requirements, inspect code and delivery
  context, and propose implementation approaches. Controlled writes:
  create branch and create pull request only.

role: developer

allowedTools:
  - jira_search_issues
  - jira_get_issue
  - github_get_repository
  - github_list_branches
  - github_get_branch
  - github_list_commits
  - github_get_commit
  - github_list_pull_requests
  - github_get_pull_request
  - github_list_pull_request_reviews
  - github_get_pull_request_checks
  - github_get_file
  - github_create_branch
  - github_create_pull_request
  - engineering_get_delivery_status
  - engineering_get_pr_status

governanceProfile: controlled-write
